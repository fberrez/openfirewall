name: Feature request
description: Suggest a focused improvement to OpenFirewall.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe a concrete use case.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Suggested behavior
      description: Explain the change and how you would use it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or tradeoffs
      description: Include any current workaround or effect on privacy, simplicity, or network behavior.
